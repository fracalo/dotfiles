onboarding = false

[theme]
name = "catppuccin-latte"
auto_switch = false

[terminal]
default_shell = "/bin/zsh"

# Mirrors ~/.tmux.conf
[keys]
prefix = "backtick"

focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

split_horizontal = "prefix+_"   # tmux split-window -v
split_vertical = "prefix+|"     # tmux split-window -h

resize_pane_up = "prefix+plus"
resize_pane_down = "prefix+minus"
resize_pane_left = "prefix+<"
resize_pane_right = "prefix+>"

reload_config = "prefix+r"
resize_mode = "prefix+shift+r"  # moved off r to keep tmux reload

close_tab = "prefix+/"          # tmux kill-window
